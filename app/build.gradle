apply plugin: 'com.android.application'

android {
	namespace 'de.markusfisch.android.screentime'
	compileSdkVersion sdk_version

	defaultConfig {
		applicationId = "io.github.hamzabounibanedz.screentime"
		minSdkVersion 11
		testInstrumentationRunner 'de.markusfisch.android.screentime.database.DatabaseImportTest'
		targetSdkVersion sdk_version

		versionCode = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
		versionName '1.4.0'

		manifestPlaceholders = [appName: '@string/app_name']
	}

	signingConfigs {
		release {
			keyAlias System.getenv('ANDROID_KEY_ALIAS')
			keyPassword System.getenv('ANDROID_KEY_PASSWORD')
			storePassword System.getenv('ANDROID_STORE_PASSWORD')
			def filePath = System.getenv('ANDROID_KEYFILE')
			storeFile filePath ? file(filePath) : null
		}
	}

	sourceSets {
		main.java.srcDirs += 'src/main/kotlin'
	}

	buildTypes {
		debug {
			applicationIdSuffix '.debug'
			manifestPlaceholders = [appName: 'DEBUG Screen Time']
		}

		release {
			minifyEnabled true
			shrinkResources true
			signingConfig signingConfigs.release
		}
	}

	// Required since Gradle 8.
	compileOptions {
		sourceCompatibility = JavaVersion.VERSION_17
		targetCompatibility = JavaVersion.VERSION_17
	}
}

dependencies {
	testImplementation "junit:junit:4.13.2"
	implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
}
