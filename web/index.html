<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#41291f"><title>Daymeter · Focus clock</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/globals.css"><link rel="stylesheet" href="/workspace.css"></head>
<body><header class="mast"><a class="brand" href="/" aria-label="Daymeter home"><img src="/logo.png" alt="">Daymeter</a><a class="install" href="/install">Get Android <span aria-hidden="true">↗</span></a></header>
<main><h1>Focus timer</h1><div class="clock-grid"><section class="clock-face"><div class="bar"><span>Focus session</span><span id="state">Ready</span></div><output id="clock" aria-label="Time remaining">25:00</output><div class="row"><button class="action" id="toggle">Start</button><button class="ghost" id="finish">Finish</button><button class="ghost" id="reset">Reset</button></div></section><aside><h2>Session length</h2><label>Minutes<input type="number" min="1" max="180" step="1" id="minutes" value="25"></label><h2 class="week-title">Last seven days</h2><div id="week"></div></aside></div><section class="history"><h2>Session history</h2><ul id="history"></ul></section>
</main><footer><span>Daymeter</span><div><a href="https://github.com/hamzabounibanedz/screen-time-android">Source</a><a href="https://github.com/hamzabounibanedz/screen-time-android/releases/latest">Android releases</a><a href="/UPSTREAM-LICENSE.txt">Upstream license</a><a href="/FONT-LICENSE.txt">Font license</a></div></footer><p id="message" role="status" aria-live="polite"></p><script type="module" src="/workspace.js"></script></body></html>
